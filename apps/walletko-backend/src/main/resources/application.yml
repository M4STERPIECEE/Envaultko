server:
  port: ${PORT:8080}

spring:
  application:
    name: walletko-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/walletko}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_TLS:false}

walletko:
  app:
    url: ${APP_URL:http://localhost:5173}
  email:
    from: ${EMAIL_FROM:noreply@walletko.local}
  auth:
    otp:
      length: 6
      expiry-seconds: 300
      max-attempts: 3
    rate-limit:
      send-otp: 3
      verify-otp: 5
      window-seconds: 60
