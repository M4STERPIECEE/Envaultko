name: Build finance-to-walletko

on: workflow_dispatch

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve short sha
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push finance-to-walletko
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/finance-to-walletko/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/m4sterpiecee/finance-to-walletko:latest
            ghcr.io/m4sterpiecee/finance-to-walletko:${{ steps.meta.outputs.sha }}
