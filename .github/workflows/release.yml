name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel: a cancelled run can abort a release mid-flight. Queue instead.
  cancel-in-progress: false

jobs:
  # Duplicated from ci.yml on purpose. ci.yml tests the PR's merge result; this
  # tests what actually landed on main, and is what gates the tag below. Keep
  # the two step lists in sync — if you add a step here, add it there too.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before tests: `pnpm test` is vitest only and never runs vite /
      # esbuild, so without this a broken build would only surface in `publish`
      # — i.e. after the tag and Release already exist.
      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # needs: [test] is load-bearing, not sequencing preference. release-please
    # tags and cuts the Release itself; anything that runs after it cannot stop
    # a release, only strand one (tag + Release exist, no image, :latest stale).
    needs: [test]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release images
    runs-on: ubuntu-latest
    needs: [release-please]
    permissions:
      contents: read
      packages: write
    if: needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Resolve release date
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push envaultko
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/envaultko/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/m4sterpiecee/envaultko:${{ needs.release-please.outputs.version }}
            ghcr.io/m4sterpiecee/envaultko:latest
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.version }}
            APP_RELEASE_DATE=${{ steps.meta.outputs.date }}

      - name: Build and push finance-to-envaultko
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/finance-to-envaultko/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/m4sterpiecee/finance-to-envaultko:${{ needs.release-please.outputs.version }}
            ghcr.io/m4sterpiecee/finance-to-envaultko:latest

  snapshot:
    name: Publish snapshot image
    runs-on: ubuntu-latest
    needs: [release-please]
    permissions:
      contents: read
      packages: write
    if: needs.release-please.result == 'success' && needs.release-please.outputs.release_created != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve snapshot metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push envaultko snapshot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/envaultko/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/m4sterpiecee/envaultko:main
            ghcr.io/m4sterpiecee/envaultko:main-${{ steps.meta.outputs.sha }}
          build-args: |
            APP_VERSION=main-${{ steps.meta.outputs.sha }}
            APP_RELEASE_DATE=${{ steps.meta.outputs.date }}
